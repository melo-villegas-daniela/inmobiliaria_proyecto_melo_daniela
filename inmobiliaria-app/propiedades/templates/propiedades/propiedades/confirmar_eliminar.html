{% extends 'propiedades/base.html' %}
{% block content %}
  <h1>Eliminar propiedad</h1>
  <p>¿Seguro que quieres eliminar <strong>{{ propiedad }}</strong>?</p>
  <form method='post'>
    {% csrf_token %}
    <button type='submit'>Sí, eliminar</button>
    <a href='{{ propiedad.get_absolute_url }}'>Cancelar</a>
  </form>
{% endblock %}
