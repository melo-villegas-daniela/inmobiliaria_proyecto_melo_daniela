{% extends 'propiedades/base.html' %}
{% block content %}
  <h1>Visitas</h1>
  <table border='1' cellpadding='4'>
    <tr><th>Propiedad</th><th>Interesado</th><th>Fecha</th><th>Estado</th></tr>
    {% for v in visitas %}
      <tr>
        <td><a href='{{ v.propiedad.get_absolute_url }}'>{{ v.propiedad }}</a></td>
        <td><a href='{{ v.get_absolute_url }}'>{{ v.nombre_interesado }}</a></td>
        <td>{{ v.fecha }}</td>
        <td>{{ v.get_estado_display }}</td>
      </tr>
    {% empty %}
      <tr><td colspan='4'>No hay visitas registradas.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
